<div
  class="bg-white border border-[#E2E8F0] rounded-xl shadow-[0_1px_2px_0_rgba(15,23,42,0.04)] overflow-hidden transition-all duration-150"
  [ngClass]="{
    'hover:border-[#CBD5E1] hover:shadow-md': hoverEffect()
  }"
>
  @if (title()) {
    <div class="p-5 border-b border-[#E2E8F0] flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white">
      <div>
        <h3 class="text-base font-semibold text-[#0F172A]">{{ title() }}</h3>
        @if (subtitle()) {
          <p class="text-xs text-[#64748B] mt-0.5">{{ subtitle() }}</p>
        }
      </div>
      <div class="flex items-center space-x-2">
        <ng-content select="[card-header-actions]"></ng-content>
      </div>
    </div>
  }

  <div [ngClass]="noPadding() ? '' : 'p-5 sm:p-6'">
    <ng-content></ng-content>
  </div>

  <ng-content select="[card-footer]"></ng-content>
</div>
