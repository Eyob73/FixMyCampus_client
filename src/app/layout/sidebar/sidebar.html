<!-- Sidebar Container -->
<aside
  class="fixed top-0 left-0 h-screen w-64 flex flex-col z-40 bg-white border-r border-slate-200 shadow-sm transition-transform duration-200 lg:translate-x-0"
  [ngClass]="isOpen ? 'translate-x-0' : '-translate-x-full'"
>
  <!-- Brand Header -->
  <div class="p-5 border-b border-slate-100 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center text-white shadow-sm shrink-0">
        <span class="material-symbols-outlined text-2xl">domain</span>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-900 tracking-tight flex items-center gap-1.5">
          FixMyCampus
          <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-blue-100 text-primary">Admin</span>
        </h1>
        <p class="text-xs text-slate-500 font-medium truncate max-w-[140px]">Campus Operations</p>
      </div>
    </div>

    <!-- Mobile Close Button -->
    <button
      type="button"
      (click)="closeSidebar.emit()"
      class="lg:hidden p-1.5 text-slate-400 hover:text-slate-600 rounded-md"
    >
      <span class="material-symbols-outlined text-xl">close</span>
    </button>
  </div>

  <!-- System Health Banner -->
  <div class="mx-4 my-3 px-3 py-2 rounded-md bg-slate-50 border border-slate-200/80 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="text-xs font-medium text-slate-700">Dispatch Online</span>
    </div>
    <span class="text-[11px] font-semibold text-slate-400">99.8% SLA</span>
  </div>

  <!-- Navigation List -->
  <nav class="flex-1 px-3 py-2 space-y-1 overflow-y-auto">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-primary text-white shadow-xs"
        [routerLinkActiveOptions]="{ exact: item.route === '/admin/dashboard' }"
        #rla="routerLinkActive"
        (click)="onNavClick()"
        class="flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition-all group duration-150"
        [ngClass]="rla.isActive ? 'bg-primary text-white' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'"
      >
        <div class="flex items-center gap-3 min-w-0">
          <span
            class="material-symbols-outlined text-xl shrink-0"
            [ngClass]="rla.isActive ? 'text-white' : 'text-slate-400 group-hover:text-slate-600'"
          >
            {{ item.icon }}
          </span>
          <span class="truncate">{{ item.label }}</span>
        </div>

        @if (item.badge) {
          <span
            class="text-xs font-bold px-2 py-0.5 rounded-full"
            [ngClass]="rla.isActive ? 'bg-white/20 text-white' : 'bg-amber-100 text-amber-800'"
          >
            {{ item.badge }}
          </span>
        }
      </a>
    }
  </nav>

  <!-- Admin User Profile & Footer -->
  <div class="p-4 border-t border-slate-200 bg-slate-50/60">
    @if (authService.currentUser(); as user) {
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          <img
            [src]="user.avatarUrl || 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80'"
            [alt]="user.name"
            class="w-9 h-9 rounded-full object-cover border border-slate-300 shrink-0"
          />
          <div class="min-w-0">
            <h4 class="text-xs font-bold text-slate-900 truncate">{{ user.name }}</h4>
            <p class="text-[11px] text-slate-500 truncate">{{ user.email }}</p>
          </div>
        </div>

        <button
          type="button"
          (click)="logout()"
          title="Sign Out"
          class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors"
        >
          <span class="material-symbols-outlined text-lg">logout</span>
        </button>
      </div>
    }
  </div>
</aside>

<!-- Backdrop overlay for mobile -->
@if (isOpen) {
  <div
    (click)="closeSidebar.emit()"
    class="fixed inset-0 z-30 bg-slate-900/40 backdrop-blur-xs lg:hidden transition-opacity"
  ></div>
}
